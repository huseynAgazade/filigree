sessionName: Filigree

sinks:
  console: true
  consoleIndented: true
  jsonl: true
  jsonlPath: logs/filigree.jsonl
  jsonlMaxBytes: 67108864
  jsonlMaxFiles: 5
  eventLog: true

process:
  trackProcesses: true
  cacheGraceMinutes: 5

ldap:
  enabled: true

  # RootDSE probes issued by client libraries during connection setup.
  # Empty base DN, base scope. Not application searches.
  excludeRootDse: true

  # Substring match, case-insensitive. Uncomment the key AND the items together.
  excludeImages: []
  # excludeImages:
  #   - \Windows\System32\svchost.exe

  excludeFilters: []
  # excludeFilters:
  #   - (objectClass=computer)
