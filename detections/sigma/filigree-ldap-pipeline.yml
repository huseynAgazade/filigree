name: filigree-ldap
priority: 10
transformations:
  - id: ldap_field_prefix
    type: field_name_prefix
    prefix: "ldap."
    field_name_conditions:
      - type: include_fields
        fields:
          - SearchFilter
          - DistinguishedName
          - AttributeList
          - ScopeOfSearch
    rule_conditions:
      - type: logsource
        service: filigree
        category: ldap_search